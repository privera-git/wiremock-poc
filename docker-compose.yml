name: wiremock-poc

services:
  wiremock:
    build: .
    image: wiremock-poc:local
    ports:
      - "${MOCK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  karate:
    build: ./tests
    profiles: ["test"]
    environment:
      API_URL: http://wiremock:8080
    volumes:
      - ./tests:/work
    depends_on:
      wiremock:
        condition: service_healthy
