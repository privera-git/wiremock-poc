name: wiremock-poc

services:
  wiremock:
    build: .
    image: wiremock-poc:local
    ports:
      - "${MOCK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  karate:
    build: ./tests
    profiles: ["test"]
    environment:
      API_URL: http://wiremock:8080
    volumes:
      - ./tests:/work
    depends_on:
      wiremock:
        condition: service_healthy

  newman:
    image: postman/newman:6.1.3-alpine
    profiles: ["test"]
    working_dir: /etc/newman
    volumes:
      - ./postman:/etc/newman
    # La carpeta "5. Fallas de conexión" se excluye: no tiene respuesta HTTP que validar.
    command: >
      run wiremock-poc.postman_collection.json
      --env-var baseUrl=http://wiremock:8080
      --folder "1. Salud"
      --folder "2. Registrar pago (POST /payments)"
      --folder "3. Consultar pago (GET /payments/{id})"
      --folder "4. Fallas HTTP (X-Mock-Fault)"
      --timeout-request 15000
    depends_on:
      wiremock:
        condition: service_healthy
