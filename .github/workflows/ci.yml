name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Contrato y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar contrato OpenAPI
        run: make lint
      - name: Pruebas Karate contra el mock
        run: make test
      - name: Publicar reporte Karate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: karate-report
          path: tests/target/karate-reports/
          if-no-files-found: ignore

  publish:
    name: Publicar imagen en Docker Hub
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar que el tag apunta a un commit de main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::El tag ${GITHUB_REF_NAME} no apunta a un commit de main"; exit 1; }
      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/wiremock-poc
          # v1.2.3 -> 1.2.3 (+ latest si no es pre-release)
          tags: type=semver,pattern={{version}}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build multi-arquitectura y push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
